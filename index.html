<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Konnect Finance | Official Links</title>
    <meta name="description" content="Official links for Konnect Finance. Whitepaper, Community, and Updates.">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #0f172a; /* Dark Navy/Black */
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --accent-color: #3b82f6; /* Konnect Blue - adjust as needed */
            --hover-color: #2563eb;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 2rem 1rem;
        }

        .profile-container {
            text-align: center;
            margin-bottom: 2rem;
            animation: fadeIn 1s ease-in;
        }

        .profile-img {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            border: 3px solid var(--accent-color);
            object-fit: cover;
            margin-bottom: 1rem;
            background-color: #fff; /* Placeholder bg if transparent logo */
        }

        h1 {
            font-size: 1.5rem;
            margin: 0.5rem 0;
            font-weight: 700;
        }

        p {
            color: #94a3b8;
            margin: 0;
            font-size: 0.95rem;
        }

        .links-container {
            width: 100%;
            max-width: 480px;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .link-card {
            background-color: var(--card-bg);
            padding: 1rem 1.5rem;
            border-radius: 50px; /* Pill shape */
            text-decoration: none;
            color: var(--text-color);
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center; /* Centered text */
            position: relative;
            transition: transform 0.2s, background-color 0.2s;
            border: 1px solid rgba(255,255,255,0.05);
        }

        .link-card:hover {
            transform: translateY(-3px);
            background-color: var(--hover-color);
            border-color: var(--accent-color);
        }

        .link-card i {
            position: absolute;
            left: 1.5rem;
            font-size: 1.2rem;
        }

        footer {
            margin-top: 3rem;
            font-size: 0.8rem;
            color: #64748b;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="profile-container">
        <img src="https://konnect.finance/resources/konnect_small_logo_black.png" alt="Konnect Logo" class="profile-img">
        <h1>Konnect Finance</h1>
        <p>Connecting Finance to the Future</p>
    </div>

    <div class="links-container">
        <a href="https://konnect.finance" class="link-card" target="_blank">
            <i class="fas fa-globe"></i>
            Official Website
        </a>

        <a hhref="https://resources.cryptocompare.com/asset-management/9766/1702557564157.pdf" class="link-card" target="_blank">
            Whitepaper
        </a>

        <a href="https://x.com/konnect_kct" class="link-card" target="_blank">
            <i class="fa-brands fa-x-twitter"></i>
            X (Twitter)
        </a>

        <a href="https://discord.gg/YOUR_INVITE" class="link-card" target="_blank">
            <i class="fab fa-discord"></i>
            Discord Community
        </a>

        <a href="https://medium.com/@KONNECT_KCT" class="link-card" target="_blank">
            <i class="fab fa-medium"></i>
            Medium Blog
        </a>
    </div>

    <footer>
        &copy; 2025 Konnect Finance. All rights reserved.
    </footer>

</body>
</html>
